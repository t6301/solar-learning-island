<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太陽能教學島｜3D 學習島</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="rail"><a class="brand" href="#" aria-label="太陽能教學島首頁">◈</a><button class="nav active" data-view="map">◎<span>探索</span></button><button class="nav" data-view="tasks">▤<span>任務</span></button><button class="nav" data-view="progress">◇<span>成就</span></button><div class="rail-bottom">ISLAND<br>ACADEMY</div></aside>

<section class="intro"><div><div class="eyebrow">發電 × 儲能 × 量測 × 查證</div><h1>把陽光，變成學習的能量。</h1><p>從太陽能發電出發，用 10 分鐘實測看懂行動電源。</p></div><div class="trip"><span>我的探索旅程</span><strong id="total">0 <small>/ 13 個任務</small></strong><div class="track"><i id="bar"></i></div></div></section>
<div class="tabs"><div><button class="tab active" data-filter="all">全部島嶼 <span>5</span></button><button class="tab" data-filter="doing">探索中</button><button class="tab" data-filter="done">已完成</button></div><span class="save-note">進度儲存在此瀏覽器</span></div>

<aside class="detail"><div class="section-label">準備好登島了嗎？ <span>✧</span></div><div id="detail"></div></aside></section>

<section id="progressView" hidden><h2>我的探索成就</h2><div id="badges"></div></section>
