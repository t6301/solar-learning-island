name: Publish solar learning island
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate progression and backend
        run: |
          node scripts/build.mjs
          node scripts/test-feedback.mjs
          node scripts/test-backend.mjs
          node scripts/test-teacher.mjs
          node scripts/test-screenshots.mjs
      - name: Build GitHub Pages
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=0
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              found=1
              break
            fi
            sleep 3
          done
          test "$found" -eq 1
      - name: Deploy GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-pages.mjs



